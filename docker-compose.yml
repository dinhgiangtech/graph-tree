version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL (Relational DB for Auth, Trees, RBAC, Logs)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gia-pha-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gia_pha_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gia_pha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Neo4j (Graph DB for Family Nodes & Relationships)
  # -------------------------------------------------------------
  neo4j:
    image: neo4j:5.22.0
    container_name: gia-pha-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt Protocol (Next.js client connection)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    environment:
      # Sets username/password to match configuration: neo4j / password
      - NEO4J_AUTH=neo4j/password
      
      # Automatically downloads and configures the APOC plugin (Awesome Procedures on Cypher)
      - NEO4J_PLUGINS=["apoc"]
      
      # Allow APOC procedures to run with unrestricted security access
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
