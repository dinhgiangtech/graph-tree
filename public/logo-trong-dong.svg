<svg
  viewBox="0 0 48 48"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
>
  <defs>
    <!-- Golden Sun & Drum Gradient -->
    <radialGradient id="solarGold" cx="24" cy="24" r="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF3C7" />
      <stop offset="0.35" stop-color="#FDE68A" />
      <stop offset="0.7" stop-color="#D97706" />
      <stop offset="1" stop-color="#B45309" />
    </radialGradient>

    <linearGradient id="goldRingStroke" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" />
      <stop offset="0.5" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- =========================================================
      CÁC VÒNG HÌNH HỌC ĐỒNG TÂM TRỐNG ĐỒNG (GEOMETRIC RINGS)
      ========================================================= -->
  <!-- 1. Vòng chỉ đôi biên ngoài cùng -->
  <circle cx="24" cy="24" r="23" stroke="url(#goldRingStroke)" stroke-width="1.2" />
  <circle cx="24" cy="24" r="21.6" stroke="url(#goldRingStroke)" stroke-width="0.6" />

  <!-- 2. Vành hoa văn quả trám / vạch đan chéo (Diamond braid ring) -->
  <circle cx="24" cy="24" r="20.5" stroke="url(#goldRingStroke)" stroke-width="0.8" stroke-dasharray="1.2 1.2" stroke-opacity="0.95" />

  <!-- 3. Vành chấm tròn đồng tâm ngoài -->
  <circle cx="24" cy="24" r="19.2" stroke="url(#goldRingStroke)" stroke-width="0.5" />
  <circle cx="24" cy="24" r="18.2" stroke="url(#goldRingStroke)" stroke-width="0.8" stroke-dasharray="0.8 1.4" />
  <circle cx="24" cy="24" r="17.2" stroke="url(#goldRingStroke)" stroke-width="0.5" />

  <!-- 4. Vành răng cưa tam giác lớn (Outer Sawtooth Ring) -->
  <circle cx="24" cy="24" r="15.8" stroke="url(#goldRingStroke)" stroke-width="1.4" stroke-dasharray="1.6 1.6" stroke-opacity="0.9" />

  <!-- 5. Vòng tròn ngăn cách thanh mảnh -->
  <circle cx="24" cy="24" r="14.4" stroke="url(#goldRingStroke)" stroke-width="0.6" />
  <circle cx="24" cy="24" r="13.2" stroke="url(#goldRingStroke)" stroke-width="0.8" stroke-dasharray="0.8 1" />
  <circle cx="24" cy="24" r="12" stroke="url(#goldRingStroke)" stroke-width="0.6" />

  <!-- 6. Vành răng cưa tam giác nhỏ (Inner Sawtooth Ring) -->
  <circle cx="24" cy="24" r="10.8" stroke="url(#goldRingStroke)" stroke-width="1.2" stroke-dasharray="1.2 1.2" stroke-opacity="0.9" />

  <!-- 7. Vòng tròn bao quanh vầng thái dương -->
  <circle cx="24" cy="24" r="9.5" stroke="url(#goldRingStroke)" stroke-width="0.5" />

  <!-- =========================================================
      TÂM ĐIỂM: NGÔI SAO THÁI DƯƠNG 14 CÁNH (14-POINT SOLAR STAR)
      ========================================================= -->
  <path
    d="M 24.00 15.00 L 24.65 21.00 L 27.65 15.95 L 26.05 21.65 L 30.70 18.35 L 27.05 22.75 L 32.40 22.00 L 27.30 24.00 L 32.40 26.00 L 27.05 25.25 L 30.70 29.65 L 26.05 26.35 L 27.65 32.05 L 24.65 27.00 L 24.00 33.00 L 23.35 27.00 L 20.35 32.05 L 21.95 26.35 L 17.30 29.65 L 20.95 25.25 L 15.60 26.00 L 20.70 24.00 L 15.60 22.00 L 20.95 22.75 L 17.30 18.35 L 21.95 21.65 L 20.35 15.95 L 23.35 21.00 Z"
    fill="url(#solarGold)"
    stroke="url(#goldRingStroke)"
    stroke-width="0.6"
  />

  <circle cx="24" cy="24" r="3.2" fill="url(#solarGold)" stroke="#8B1E1E" stroke-width="0.6" />
  <circle cx="24" cy="24" r="1.4" fill="#8B1E1E" />
</svg>
